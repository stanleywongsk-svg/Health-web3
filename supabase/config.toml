project_id = "healthloop-local-dev"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "healthloop://auth"
additional_redirect_urls = ["healthloop://auth"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600
[auth.email.template.magic_link]
subject = "HealthLoop 登录验证码"
content_path = "./supabase/templates/otp.html"
[auth.email.template.confirmation]
subject = "HealthLoop 电邮验证码"
content_path = "./supabase/templates/otp.html"
[functions.core]
verify_jwt = false
# getUser(accessToken) validates every request inside handler; this also supports
# current asymmetric signing keys. There is no anonymous business RPC path.
entrypoint = "./functions/core/index.ts"
import_map = "./functions/core/deno.json"
